# Render Blueprint: public web service + private worker + managed PostgreSQL.
# Never put provider credentials or user data in this file.
envVarGroups:
  - name: research-agent-crypto
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

services:
  - type: web
    name: research-opportunity-agent
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: research-agent-crypto
      - key: APP_ENV
        value: production
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: research-agent-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: research-opportunity-worker
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - fromGroup: research-agent-crypto
      - key: APP_ENV
        value: production
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost
      - key: DATABASE_URL
        fromDatabase:
          name: research-agent-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: research-agent-db
    databaseName: research_agent
    user: research_agent
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
