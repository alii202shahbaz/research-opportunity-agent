# Free-tier Render web service. PostgreSQL is hosted separately on Supabase Free.
# Scheduled background jobs run from GitHub Actions, so no paid Render worker is needed.
envVarGroups:
  - name: research-agent-crypto
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

services:
  - type: web
    name: research-opportunity-agent
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - fromGroup: research-agent-crypto
      - key: APP_ENV
        value: production
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
