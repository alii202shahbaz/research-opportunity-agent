[project]
name = "research-opportunity-agent"
version = "0.1.0"
description = "Multi-user research opportunity discovery agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<47",
  "argon2-cffi>=23.1,<26",
  "python-dotenv>=1,<2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
